name: Gerar IPA do FOCO

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Compilar (sem assinatura)
        working-directory: ios
        run: |
          xcodebuild -project FOCO.xcodeproj -scheme FOCO -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/FOCO.app Payload/
          zip -qry FOCO.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FOCO-ipa
          path: FOCO.ipa
